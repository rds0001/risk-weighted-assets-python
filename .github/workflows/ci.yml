name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "ruff>=0.11,<1"

      - name: Validate source and external-publication boundary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python tools/verify_source_tree.py

      - name: Run static quality checks
        run: python -m ruff check --no-cache src tests tools examples

      - name: Run automated tests
        run: python -m pytest

  distribution:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up build Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata and archive boundary
        run: |
          python -m twine check dist/*
          python tools/validate_distribution.py dist
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/rwa-wheel-smoke
          /tmp/rwa-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/rwa-wheel-smoke/bin/python tools/smoke_installed.py

      - name: Smoke-test installed source distribution
        run: |
          python -m venv /tmp/rwa-sdist-smoke
          /tmp/rwa-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/rwa-sdist-smoke/bin/python tools/smoke_installed.py

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: risk-weighted-assets-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
