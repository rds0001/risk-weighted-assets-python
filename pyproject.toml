[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-weighted-assets"
version = "1.2.0"
description = "Auditable CRR III RWA, capital, IRRBB and ICAAP reference engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "RiskDataScience GmbH", email = "riskdatascience@web.de"},
]
maintainers = [
  {name = "RiskDataScience GmbH", email = "riskdatascience@web.de"},
]
keywords = [
  "banking", "CRR III", "RWA", "capital adequacy", "IRRBB", "ICAAP",
  "credit risk", "market risk", "operational risk", "regulatory reporting",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
build = [
  "build>=1.2,<2",
  "twine>=6,<8",
]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
  "twine>=6,<8",
]

[project.scripts]
rwa = "rwa_engine.cli:main"
rwa-web = "rwa_engine.web.server:main"

[project.urls]
Homepage = "https://github.com/rds0001/risk-weighted-assets-python"
Documentation = "https://github.com/rds0001/risk-weighted-assets-python/tree/main/docs"
Repository = "https://github.com/rds0001/risk-weighted-assets-python.git"
Issues = "https://github.com/rds0001/risk-weighted-assets-python/issues"
Changelog = "https://github.com/rds0001/risk-weighted-assets-python/blob/main/CHANGELOG.md"
Imprint = "https://riskdatascience.net/impressum/"
"Privacy Policy" = "https://riskdatascience.net/datenschutzerklaerung/"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rwa_engine*"]

[tool.setuptools.package-data]
rwa_engine = [
  "py.typed",
  "web/static/*",
  "resources/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["rwa_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
